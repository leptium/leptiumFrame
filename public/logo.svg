<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Icon Drop Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Outer Frame Bevel Gradient -->
    <linearGradient id="frameBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Squircle Body Background -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c24" />
      <stop offset="50%" stop-color="#121217" />
      <stop offset="100%" stop-color="#08080c" />
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glassFill" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.45" />
    </linearGradient>

    <!-- Dynamic Neon Accent Gradient (Cyan to Royal Blue) -->
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Mountain Gradient Fill (Semi-transparent Frost) -->
    <linearGradient id="mountainFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.05" />
    </linearGradient>

    <!-- Back Mountain Gradient -->
    <linearGradient id="backMountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Picture Horizon Gradient -->
    <linearGradient id="photoSky" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#060913" stop-opacity="0.95" />
    </linearGradient>

    <!-- Digital Sun Warm Gold & Radiant Glow -->
    <linearGradient id="sunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ffd60a" />
      <stop offset="100%" stop-color="#ff9f0a" />
    </linearGradient>

    <!-- Glass Specular Reflection Highlight -->
    <linearGradient id="specularReflect" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Flare Blur -->
    <filter id="flareGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" />
    </filter>

    <!-- Sun Bloom Filter -->
    <filter id="sunBloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Display Screen Clipping Mask -->
    <clipPath id="screenClip">
      <rect x="68" y="68" width="376" height="376" rx="60" />
    </clipPath>
  </defs>

  <!-- Group with Drop Shadow for the entire App Icon -->
  <g filter="url(#iconShadow)">
    <!-- Master Squircle Container (Apple / macOS HIG 512px geometry) -->
    <rect x="28" y="28" width="456" height="456" rx="102" fill="url(#squircleBg)" />
    
    <!-- Outer Metallic Bevel Ring -->
    <rect x="28" y="28" width="456" height="456" rx="102" fill="none" stroke="url(#frameBevel)" stroke-width="2.5" />
    <rect x="30" y="30" width="452" height="452" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Subtle Ambient Corner Light Spheres -->
    <circle cx="90" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#flareGlow)" />
    <circle cx="420" cy="420" r="160" fill="#ffd60a" opacity="0.08" filter="url(#flareGlow)" />

    <!-- Inner Frame Bezel (Digital Display Border) -->
    <rect x="64" y="64" width="384" height="384" rx="64" fill="#090d16" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Display Screen Content (Clipped with smooth corners) -->
    <g clip-path="url(#screenClip)">
      <!-- Horizon / Sky Atmosphere Fill -->
      <rect x="68" y="68" width="376" height="376" fill="url(#photoSky)" />

      <!-- Minimalist Subtle Grid (Digital Display DNA) -->
      <g stroke="rgba(56, 189, 248, 0.05)" stroke-width="1">
        <line x1="68" y1="162" x2="444" y2="162" />
        <line x1="68" y1="256" x2="444" y2="256" />
        <line x1="68" y1="350" x2="444" y2="350" />
        <line x1="162" y1="68" x2="162" y2="444" />
        <line x1="256" y1="68" x2="256" y2="444" />
        <line x1="350" y1="68" x2="350" y2="444" />
      </g>

      <!-- Digital Sun / Core Orb Glow Bloom -->
      <circle cx="204" cy="192" r="48" fill="#ffd60a" opacity="0.22" filter="url(#sunBloom)" />
      <circle cx="204" cy="192" r="32" fill="url(#neonAccent)" filter="url(#neonBlur)" opacity="0.55" />
      <circle cx="204" cy="192" r="24" fill="url(#sunGold)" filter="url(#sunBloom)" />
      <circle cx="204" cy="192" r="16" fill="#fffdfa" />

      <!-- Background Mountain Range (Depth Layer) -->
      <path d="M112 368 L168 288 C176 277 192 277 200 288 L256 368" fill="none" stroke="url(#backMountainGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
      <path d="M112 368 L168 288 C176 277 192 277 200 288 L256 368 Z" fill="url(#mountainFill)" opacity="0.4" />

      <!-- Secondary Peak Line -->
      <path d="M304 368 L348 312 C354 304 366 304 372 312 L412 368" fill="none" stroke="url(#backMountainGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

      <!-- Fore Mountain Peak (Hero Geometry from Gemini ChatBox) -->
      <path d="M192 376 L264 278 C273 266 291 266 300 278 L376 376 Z" fill="url(#mountainFill)" />
      <path d="M192 376 L264 278 C273 266 291 266 300 278 L376 376" fill="none" stroke="url(#neonAccent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBlur)" />
      <path d="M192 376 L264 278 C273 266 291 266 300 278 L376 376" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Modern Baseline Horizon Line -->
      <line x1="96" y1="376" x2="416" y2="376" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" stroke-linecap="round" />
      <line x1="140" y1="376" x2="372" y2="376" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#neonBlur)" />

      <!-- Inner Glass Surface Texture Fill -->
      <rect x="68" y="68" width="376" height="376" fill="url(#glassFill)" />

      <!-- Apple VisionOS Curved Glass Specular Highlight Reflex -->
      <path d="M68 68 Q256 120 444 68 L444 190 Q256 240 68 190 Z" fill="url(#specularReflect)" />

      <!-- Floating Digital Spark / Lens Flare Sparkle -->
      <g transform="translate(352, 142)">
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
        <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
        <circle cx="0" cy="0" r="2.5" fill="#ffd60a" filter="url(#neonBlur)" />
      </g>
    </g>

    <!-- High-Precision Digital Frame Corner Reticles (L-shaped Focus Ticks) -->
    <!-- Top-Left -->
    <path d="M84 104 L84 84 L104 84" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <!-- Top-Right -->
    <path d="M428 104 L428 84 L408 84" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <!-- Bottom-Left -->
    <path d="M84 408 L84 428 L104 428" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <!-- Bottom-Right -->
    <path d="M428 408 L428 428 L408 428" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
